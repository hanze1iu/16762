# =============================================================================
# Semantic Map Configuration
# =============================================================================
# Coordinates are in the map frame (meters). Fill these in using map_annotator.py
# after building your SLAM map.
#
# HOW TO POPULATE:
#   1. Build the SLAM map (see README.md M1 instructions)
#   2. Launch Nav2 with your saved map
#   3. Run:  python3 map_annotator.py
#   4. In RViz, click "Publish Point" on the map to record coordinates
#   5. The annotator will prompt you to label each point
# =============================================================================

# Named drop-off locations where objects are placed after fetch
dropoffs:
  default:
    x: 0.0
    y: 0.0
    yaw: 0.0       # radians
    description: "Starting position / default drop-off"

  # Add more drop-offs here, e.g.:
  # table:
  #   x: 1.2
  #   y: -0.5
  #   yaw: 1.57
  #   description: "Kitchen table"

# Named semantic zones
# nav_point    : where the robot navigates to start searching (center of zone)
# orbit_waypoints : additional viewpoints to check if Phase 1 sweep fails
# description  : human-readable label (shown in CLI output)
zones:
  # Example zone - replace with real coordinates from map_annotator.py
  # kitchen:
  #   description: "Kitchen / counter area"
  #   nav_point:
  #     x: 2.1
  #     y: -1.3
  #     yaw: 0.0
  #   orbit_waypoints:
  #     - {x: 2.3, y: -1.0, yaw: -1.57}
  #     - {x: 1.9, y: -1.0, yaw:  1.57}
  #     - {x: 2.1, y: -1.6, yaw:  0.0}
  #
  # study:
  #   description: "Study / desk area"
  #   nav_point:
  #     x: 0.8
  #     y: 1.5
  #     yaw: 1.57
  #   orbit_waypoints:
  #     - {x: 0.5, y: 1.7, yaw: 0.0}
  #     - {x: 1.1, y: 1.7, yaw: 3.14}

# Object → zone mapping
# List zones in priority order (robot checks first zone first).
# Use the exact zone names defined above.
# Object names must match what YOLO-E is queried with (case-sensitive).
object_zones:
  # water bottle: [kitchen]
  # coffee mug:   [kitchen, study]
  # book:         [study]
  # pen:          [study]
  # apple:        [kitchen]
